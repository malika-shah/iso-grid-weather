name: Fetch ISO Market Telemetry

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Add write permissions for git push
permissions:
  contents: write

jobs:
  build-and-fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gridstatus pandas requests

      - name: Fetch Live Market & Weather Data
        run: |
          python fetch_data.py

      - name: Commit and Push Updated Market JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market_data.json
          git status
          git diff --quiet && git diff --staged --quiet || (git commit -m "Chore: Update real-time ISO telemetry data [skip ci]" && git push)
